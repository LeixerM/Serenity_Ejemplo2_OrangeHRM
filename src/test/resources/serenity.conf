serenity {
  project.name = "OrangeHRM PIM - Serenity BDD Screenplay"
  take.screenshots = FOR_EACH_ACTION
}

webdriver {
  driver = chrome
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      # Headless so the suite runs on CI runners; a desktop-size window keeps the side menu expanded.
      # Remove "headless=new" to watch the browser.
      args = ["headless=new", "window-size=1920,1080", "incognito", "no-sandbox", "disable-dev-shm-usage"]
    }
  }
}

# Public demo account by default. Override with ORANGEHRM_USERNAME / ORANGEHRM_PASSWORD environment
# variables or -Dorangehrm.username=... / -Dorangehrm.password=...
orangehrm {
  username = "Admin"
  password = "admin123"
}

environments {
  default {
    webdriver.base.url = "https://opensource-demo.orangehrmlive.com/web/index.php/auth/login"
  }
}
