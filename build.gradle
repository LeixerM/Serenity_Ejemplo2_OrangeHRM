plugins {
    id 'java'
    id 'net.serenity-bdd.serenity-gradle-plugin' version '5.3.9'
}

defaultTasks 'clean', 'test', 'aggregate'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

ext {
    serenityVersion = '5.3.11'
    // Aligned with the Cucumber version managed by Serenity BDD 5.3.11
    cucumberVersion = '7.34.2'
    // Aligned with the JUnit version managed by Serenity BDD 5.3.11
    junitVersion = '6.0.3'
    logbackVersion = '1.5.38'
}

dependencies {
    implementation "net.serenity-bdd:serenity-core:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-cucumber:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-screenplay:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-screenplay-webdriver:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-ensure:${serenityVersion}"
    implementation "io.cucumber:cucumber-junit-platform-engine:${cucumberVersion}"
    implementation platform("org.junit:junit-bom:${junitVersion}")
    implementation 'org.junit.platform:junit-platform-suite'
    implementation 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation "ch.qos.logback:logback-classic:${logbackVersion}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    systemProperties System.getProperties().findAll { it.key.toString().startsWith('environment') || it.key.toString().startsWith('cucumber.') || it.key.toString().startsWith('orangehrm.') }
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

gradle.startParameter.continueOnFailure = true

test.finalizedBy(aggregate)
